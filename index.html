<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIROX — Built Different</title>
<meta name="description" content="Independent Indian streetwear. Limited drops, print-on-demand, built different." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ffffff;
    --ink-2:#f3f3f1;
    --bone:#111111;
    --ash:#767672;
    --acid:#111111;
    --rust:#c02c14;
    --line:#e6e6e2;
    --dark-bg:#0a0a0a;
    --dark-fg:#ffffff;
    --dark-muted:rgba(255,255,255,.55);
    --radius:0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:'Barlow Semi Condensed', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--acid); color:var(--ink);}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  img{max-width:100%; display:block;}
  .h-display{
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.04em;
    line-height:0.92;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .wrap{max-width:1280px; margin:0 auto; padding:0 24px;}
  :focus-visible{outline:2px solid var(--acid); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ===== Announcement / drop bar ===== */
  .announce{
    background:var(--acid); color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:700; letter-spacing:0.06em;
    padding:8px 0; overflow:hidden; white-space:nowrap;
    text-transform:uppercase;
  }
  .announce__track{
    display:inline-block; padding-left:100%;
    animation:marquee 22s linear infinite;
  }
  .announce__track span{margin-right:48px;}
  @keyframes marquee{ from{transform:translateX(0);} to{transform:translateX(-100%);} }

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(10,10,10,0.94);
    color:var(--dark-fg);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px; gap:24px;
  }
  .logo{
    font-family:'Barlow Condensed', sans-serif;
    font-size:28px; letter-spacing:0.06em;
    display:inline-block;
  }
  .navlinks{display:flex; gap:32px; font-size:13px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;}
  .navlinks a{position:relative; padding-bottom:4px; opacity:.85; transition:opacity .15s;}
  .navlinks a:hover, .navlinks a.active{opacity:1;}
  .navlinks a.active::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--dark-fg);
  }
  .navlinks{display:none;}
  @media(min-width:900px){ .navlinks{display:flex;} }
  .navicons{display:flex; align-items:center; gap:18px;}
  .navicons button{position:relative; width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
  .badge{
    position:absolute; top:-6px; right:-8px;
    background:var(--dark-fg); color:var(--dark-bg);
    font-family:'JetBrains Mono'; font-size:10px; font-weight:700;
    width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .menu-btn{display:flex;}
  @media(min-width:900px){ .menu-btn{display:none;} }

  /* mobile drawer */
  .drawer{
    position:fixed; inset:0; background:var(--ink); z-index:100;
    transform:translateX(100%); transition:transform .3s ease;
    padding:24px; overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer .navlinks{display:flex; flex-direction:column; gap:0; font-size:22px; font-family:'Barlow Condensed'; letter-spacing:.05em; margin-top:48px;}
  .drawer .navlinks a{padding:16px 0; border-bottom:1px solid var(--line);}
  .drawer-close{position:absolute; top:24px; right:24px; font-size:28px; font-family:'Barlow Condensed';}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 28px;
    font-family:'JetBrains Mono'; font-size:12px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase;
    border:1px solid var(--bone);
    transition:transform .15s ease, background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .btn-primary{background:var(--acid); border-color:var(--acid); color:var(--ink);}
  .btn-primary:hover{transform:translate(-2px,-2px); box-shadow:4px 4px 0 var(--bone);}
  .btn-outline{background:transparent; color:var(--bone);}
  .btn-outline:hover{transform:translate(-2px,-2px); box-shadow:4px 4px 0 var(--acid); border-color:var(--acid); color:var(--acid);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none !important; box-shadow:none !important;}

  /* ===== Hero ===== */
  .hero{
    display:grid; grid-template-columns:1fr; position:relative; overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  @media(min-width:960px){ .hero{grid-template-columns:1fr 1fr;} }
  .hero__copy{
    padding:64px 24px; display:flex; flex-direction:column; justify-content:center; gap:20px;
    position:relative; z-index:2;
  }
  .eyebrow{
    font-family:'JetBrains Mono'; font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--acid); display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{content:""; width:8px; height:8px; background:var(--acid); display:inline-block;}
  .hero h1{font-size:clamp(42px,7vw,84px);}
  .hero h1 .accent{background:var(--dark-bg); color:var(--dark-fg); padding:0 10px; display:inline-block;}
  .hero p{color:var(--ash); font-size:16px; max-width:38ch; line-height:1.5;}
  .hero__cta{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px;}
  .hero__img{
    position:relative; min-height:340px;
    background:linear-gradient(180deg,#1a1c15,#0b0c0a);
    display:flex; align-items:flex-end; justify-content:center;
    border-left:1px solid var(--line);
  }
  .hero__img svg{width:100%; height:auto; max-height:520px;}

  /* drop countdown — signature element */
  .dropbar{
    border-bottom:1px solid var(--line);
    background:var(--ink-2);
  }
  .dropbar__inner{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:24px;
    padding:16px 24px; text-align:center;
  }
  .dropbar__label{font-family:'JetBrains Mono'; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ash);}
  .dropbar__timer{display:flex; gap:10px;}
  .dropbar__unit{font-family:'JetBrains Mono'; font-size:20px; font-weight:700; color:var(--acid); min-width:2.4ch; text-align:center;}
  .dropbar__unit small{display:block; font-size:9px; color:var(--ash); font-weight:400; letter-spacing:.08em;}

  /* ===== Trust strip ===== */
  .trust{border-bottom:1px solid var(--line); background:var(--ink-2);}
  .trust__grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px; padding:28px 24px;}
  @media(min-width:760px){ .trust__grid{grid-template-columns:repeat(4,1fr);} }
  .trust__item{display:flex; align-items:center; gap:12px; font-size:13px;}
  .trust__item strong{display:block; font-size:13px;}
  .trust__item span{color:var(--ash); font-size:12px;}
  .trust__icon{width:28px; height:28px; flex:none; color:var(--acid);}

  /* ===== Section heading ===== */
  .section{padding:64px 0;}
  .section__head{
    display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:32px; gap:16px; flex-wrap:wrap;
  }
  .section__title{font-size:clamp(26px,3.4vw,38px);}
  .section__link{font-family:'JetBrains Mono'; font-size:12px; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--bone); padding-bottom:2px;}

  /* ===== Category grid ===== */
  .cat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:2px; background:var(--line);}
  @media(min-width:700px){ .cat-grid{grid-template-columns:repeat(4,1fr);} }
  .cat-card{
    position:relative; aspect-ratio:3/4; background:var(--ink-2); overflow:hidden;
    display:flex; align-items:flex-end; padding:18px;
  }
  .cat-card svg{position:absolute; inset:0; width:100%; height:100%; opacity:.55; transition:transform .4s ease, opacity .3s ease;}
  .cat-card:hover svg{transform:scale(1.06); opacity:.75;}
  .cat-card__label{position:relative; z-index:2;}
  .cat-card__label .h-display{font-size:22px;}
  .cat-card__label span{font-family:'JetBrains Mono'; font-size:11px; color:var(--acid); text-transform:uppercase; letter-spacing:.06em;}

  /* ===== Product grid ===== */
  .prod-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line);}
  @media(min-width:700px){ .prod-grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:1080px){ .prod-grid{grid-template-columns:repeat(6,1fr);} }
  .card{background:var(--ink); padding:14px; display:flex; flex-direction:column; gap:8px; position:relative;}
  .card__img{aspect-ratio:1; background:var(--ink-2); position:relative; overflow:hidden;}
  .card__img svg{width:100%; height:100%;}
  .card__wish{
    position:absolute; top:10px; right:10px; z-index:3;
    width:30px; height:30px; background:rgba(11,12,10,.7); display:flex; align-items:center; justify-content:center;
  }
  .card__wish svg{width:16px; height:16px; stroke:var(--bone); fill:none; transition:fill .15s, stroke .15s;}
  .card__wish.active svg{fill:var(--acid); stroke:var(--acid);}
  .card__tag{
    position:absolute; top:10px; left:10px; z-index:3;
    background:var(--acid); color:var(--ink); font-family:'JetBrains Mono'; font-size:10px; font-weight:700;
    padding:3px 8px; text-transform:uppercase; letter-spacing:.04em;
  }
  .card__name{font-size:13px; font-weight:600;}
  .card__meta{display:flex; align-items:center; justify-content:space-between;}
  .card__price{font-family:'JetBrains Mono'; font-size:13px;}
  .card__price del{color:var(--ash); font-weight:400; margin-right:6px;}
  .card__sku{font-family:'JetBrains Mono'; font-size:10px; color:var(--ash); letter-spacing:.05em;}
  .card a.card__link{position:absolute; inset:0; z-index:1;}
  .card__add{
    margin-top:2px; font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    border:1px solid var(--line); padding:8px; text-align:center; position:relative; z-index:3;
    transition:background .15s, border-color .15s;
  }
  .card__add:hover{background:var(--acid); border-color:var(--acid); color:var(--ink);}

  /* ===== Featured Drops (dark slider) ===== */
  .drops{background:var(--dark-bg); color:var(--dark-fg); padding:56px 0 50px; overflow:hidden;}
  .drops__head{max-width:820px; margin-bottom:32px;}
  .drops__eyebrow{display:block; margin-bottom:12px; font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--dark-muted);}
  .drops__head h2{font-size:clamp(40px,5.5vw,72px); font-weight:700; line-height:.86; letter-spacing:-.03em; text-transform:uppercase; color:var(--dark-fg); margin-bottom:14px;}
  .drops__head p{max-width:640px; font-size:15px; line-height:1.5; color:var(--dark-muted);}
  .drops__slider{position:relative;}
  .drops__track{display:flex; gap:16px; overflow-x:auto; scroll-behavior:smooth; scrollbar-width:none; padding-bottom:6px; cursor:grab;}
  .drops__track::-webkit-scrollbar{display:none;}
  .drops__track:active{cursor:grabbing;}
  .drop-card{position:relative; flex:0 0 260px; min-width:0;}
  @media(min-width:700px){ .drop-card{flex-basis:calc((100% - 48px)/4);} }
  .drop-card__img{position:relative; aspect-ratio:4/5; overflow:hidden; background:#151515;}
  .drop-card__img img{width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.7,.2,1);}
  .drop-card:hover .drop-card__img img{transform:scale(1.05);}
  .drop-card__badge{position:absolute; top:12px; left:12px; background:#fff; color:#000; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:5px 9px;}
  .drop-card__title-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:12px;}
  .drop-card__title-row h3{font-size:15px; font-weight:600; text-transform:uppercase; letter-spacing:.02em;}
  .drop-card__price{font-family:'JetBrains Mono'; font-size:12px; color:var(--dark-muted); white-space:nowrap;}
  .drop-card__link{display:inline-flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dark-fg); border-bottom:1px solid rgba(255,255,255,.35); padding-bottom:2px;}
  .drops__controls{display:flex; gap:10px; justify-content:flex-end; margin-top:20px;}
  .drops__arrow{width:40px; height:40px; border:1px solid rgba(255,255,255,.25); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; transition:background .2s;}
  .drops__arrow:hover{background:rgba(255,255,255,.1);}

  /* ===== Comparison slider (front/back) ===== */
  .compare-section{padding:64px 0; background:var(--ink);}
  .compare-grid{display:grid; grid-template-columns:1fr; gap:32px; align-items:center;}
  @media(min-width:900px){ .compare-grid{grid-template-columns:1.3fr 1fr;} }
  .compare-slider{position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--ink-2); user-select:none;}
  .compare-slider img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; -webkit-user-drag:none; user-drag:none;}
  .compare-slider .after{clip-path:inset(0 0 0 50%);}
  .compare-slider__handle{position:absolute; top:0; bottom:0; left:50%; width:2px; background:#fff; transform:translateX(-1px); box-shadow:0 0 0 1px rgba(0,0,0,.15);}
  .compare-slider__grip{position:absolute; top:50%; left:50%; width:40px; height:40px; background:#fff; border-radius:50%; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 2px 10px rgba(0,0,0,.25); cursor:ew-resize;}
  .compare-slider__label{position:absolute; top:14px; font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.08em; text-transform:uppercase; background:rgba(255,255,255,.9); color:#000; padding:4px 9px;}
  .compare-slider__label.before{left:14px;}
  .compare-slider__label.after{right:14px;}
  .compare-copy h2{font-size:clamp(30px,4vw,44px); text-transform:uppercase; line-height:.95; margin-bottom:14px;}
  .compare-copy p{color:var(--ash); font-size:15px; max-width:36ch; line-height:1.5;}

  /* ===== Story section ===== */
  .story{padding:80px 0; background:var(--ink);}
  .story__label{margin-bottom:36px; font-size:17px; color:var(--ash);}
  .story__grid{display:grid; grid-template-columns:1fr; gap:40px; align-items:center;}
  @media(min-width:900px){ .story__grid{grid-template-columns:1fr 1fr; gap:8vw;} }
  .story__headline{font-size:clamp(52px,8vw,104px); font-weight:700; line-height:.84; letter-spacing:-.04em; text-transform:uppercase;}
  .story__content p{margin-bottom:22px; font-size:16px; line-height:1.55; color:var(--ash); max-width:60ch;}
  .story__btn{display:inline-flex; align-items:center; justify-content:space-between; gap:14px; min-width:170px; height:48px; padding:4px 5px 4px 20px; background:var(--bone); color:var(--ink); border-radius:30px; font-size:15px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; transition:transform .2s ease;}
  .story__btn:hover{transform:translateY(-2px);}
  .story__btn-arrow{width:38px; height:38px; border-radius:50%; background:var(--ink); color:var(--bone); display:flex; align-items:center; justify-content:center; font-size:18px;}

  /* ===== Benefits (Why shop with us) ===== */
  .benefits{padding:80px 0; background:var(--ink);}
  .benefits__wrapper{display:grid; grid-template-columns:1fr; gap:48px;}
  @media(min-width:900px){ .benefits__wrapper{grid-template-columns:0.9fr 1.5fr; align-items:center;} }
  .benefits__eyebrow{display:block; margin-bottom:14px; font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ash);}
  .benefits__intro h2{font-size:clamp(38px,5vw,62px); line-height:.88; letter-spacing:-.03em; text-transform:uppercase; margin-bottom:18px;}
  .benefits__intro p{color:var(--ash); font-size:16px; line-height:1.5; max-width:38ch;}
  .benefits__grid{display:grid; grid-template-columns:repeat(2,1fr); gap:40px;}
  @media(max-width:520px){ .benefits__grid{grid-template-columns:1fr; gap:28px;} }
  .benefit{display:grid; grid-template-columns:52px 1fr; gap:16px; align-items:start; transition:transform .2s ease;}
  .benefit:hover{transform:translateY(-3px);}
  .benefit__icon{width:52px; height:52px; border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ash); transition:.2s ease; flex:none;}
  .benefit:hover .benefit__icon{background:var(--bone); color:var(--ink); border-color:var(--bone);}
  .benefit__icon svg{width:20px; height:20px; stroke:currentColor; stroke-width:1.5; fill:none;}
  .benefit h3{font-size:19px; font-weight:600; text-transform:uppercase; margin-bottom:6px;}
  .benefit p{color:var(--ash); font-size:14px; line-height:1.45; max-width:28ch;}

  /* ===== FAQ accordion ===== */
  .faq{padding:64px 0 88px; background:var(--ink);}
  .faq h2{font-size:clamp(26px,3.4vw,36px); text-transform:uppercase; margin-bottom:28px;}
  .faq-row{border-top:1px solid var(--line);}
  .faq-row:last-child{border-bottom:1px solid var(--line);}
  .faq-row summary{list-style:none; cursor:pointer; padding:20px 4px; display:flex; align-items:center; justify-content:space-between; font-size:16px; font-weight:600; text-transform:uppercase; letter-spacing:.01em;}
  .faq-row summary::-webkit-details-marker{display:none;}
  .faq-row summary::after{content:"+"; font-family:'JetBrains Mono'; font-size:20px; font-weight:400; transition:transform .2s ease;}
  .faq-row[open] summary::after{transform:rotate(45deg);}
  .faq-row p{padding:0 4px 20px; color:var(--ash); font-size:14px; line-height:1.55; max-width:65ch;}

  /* ===== Promo banners ===== */
  .promo-grid{display:grid; grid-template-columns:1fr; gap:2px; background:var(--line);}
  @media(min-width:820px){ .promo-grid{grid-template-columns:1fr 1fr;} }
  .promo{
    background:var(--ink-2); padding:40px; min-height:220px;
    display:flex; flex-direction:column; justify-content:center; gap:14px; position:relative; overflow:hidden;
  }
  .promo--accent{background:var(--acid); color:var(--ink);}
  .promo__label{font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.8;}
  .promo h3{font-size:clamp(24px,3vw,34px);}
  .promo--accent .btn-outline{border-color:var(--ink); color:var(--ink);}
  .promo--accent .btn-outline:hover{box-shadow:4px 4px 0 var(--ink); color:var(--ink);}

  /* ===== Newsletter ===== */
  .newsletter{border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .newsletter__inner{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:20px; padding:28px 24px;
  }
  .newsletter__copy strong{display:block; font-family:'Barlow Condensed'; font-size:20px; letter-spacing:.04em;}
  .newsletter__copy span{color:var(--ash); font-size:13px;}
  .newsletter form{display:flex; gap:0; flex:1; max-width:420px; min-width:260px;}
  .newsletter input{
    flex:1; background:transparent; border:1px solid var(--line); border-right:none;
    padding:12px 14px; color:var(--bone); font-family:'Barlow Semi Condensed'; font-size:13px;
  }
  .newsletter input:focus-visible{outline-offset:-2px;}
  .newsletter button{background:var(--acid); color:var(--ink); padding:0 20px; font-family:'JetBrains Mono'; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;}

  /* ===== Footer ===== */
  footer{padding:48px 0 24px;}
  .foot-grid{display:grid; grid-template-columns:1fr; gap:32px;}
  @media(min-width:760px){ .foot-grid{grid-template-columns:1.4fr repeat(3,1fr);} }
  .foot-brand .logo{font-size:26px;}
  .foot-brand p{color:var(--ash); font-size:13px; margin-top:12px; max-width:32ch;}
  .foot-col h4{font-family:'JetBrains Mono'; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px; color:var(--ash);}
  .foot-col ul li{margin-bottom:10px; font-size:13px;}
  .foot-col ul li a:hover{color:var(--acid);}
  .foot-bottom{
    margin-top:40px; padding-top:20px; border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px;
    font-size:12px; color:var(--ash);
  }

  /* ===== Cart / Wishlist drawer ===== */
  .side-drawer{
    position:fixed; top:0; right:0; height:100%; width:100%; max-width:420px;
    background:var(--ink); border-left:1px solid var(--line); z-index:200;
    transform:translateX(100%); transition:transform .3s ease;
    display:flex; flex-direction:column;
  }

<script>
/* ============================================================
   VIROX — single-file storefront SPA
   Hash routing · localStorage cart/wishlist · live backend API
   Swap API_BASE to your deployed backend (Render/Express+Supabase)
   ============================================================ */
const API_BASE = window.VIROX_API_BASE || "http://localhost:4000";

/* ---------- demo catalog (used only if the API is unreachable) ---------- */
const DEMO_PRODUCTS = [
  {id:"p0", slug:"virox-clothing-oversized-tee-black", name:"Virox Clothing Oversized Tee — Black", category:"typography", price:1499, compare_at_price:null, is_new:true, sku:"VX-TY-000", image:"assets/virox-clothing-oversized-tee-black.png"},
  {id:"p1", slug:"chaos-oversized-tee", name:"Chaos Oversized Tee — Black", category:"streetwear", price:1499, compare_at_price:null, is_new:true, sku:"VX-ST-001", art:"skull"},
  {id:"p2", slug:"stand-out-oversized-tee", name:"Stand Out Oversized Tee — Sand", category:"typography", price:1399, compare_at_price:null, is_new:true, sku:"VX-TY-002", art:"type"},
  {id:"p3", slug:"ronin-oversized-tee", name:"Ronin Oversized Tee — Black", category:"anime", price:1599, compare_at_price:1799, is_new:false, sku:"VX-AN-003", art:"anime"},
  {id:"p4", slug:"static-oversized-tee", name:"Static Oversized Tee — Charcoal", category:"streetwear", price:1499, compare_at_price:null, is_new:false, sku:"VX-ST-004", art:"skull"},
  {id:"p5", slug:"lowercase-oversized-tee", name:"Lowercase Oversized Tee — Olive", category:"typography", price:1399, compare_at_price:null, is_new:true, sku:"VX-TY-005", art:"type"},

];
const CATEGORIES = [
  {key:"streetwear", label:"Streetwear", art:"skull"},
  {key:"typography", label:"Typography", art:"type"},
  {key:"newdrop", label:"New Drop", art:"tee"},
  {key:"anime", label:"Anime", art:"anime"},

/* ---------- state ---------- */
const state = {
  products: [],
  loaded: false,
  cart: JSON.parse(localStorage.getItem("vx_cart") || "[]"),
  wishlist: JSON.parse(localStorage.getItem("vx_wishlist") || "[]"),
};
function saveCart(){ localStorage.setItem("vx_cart", JSON.stringify(state.cart)); renderCartCount(); }
function saveWishlist(){ localStorage.setItem("vx_wishlist", JSON.stringify(state.wishlist)); renderWishCount(); }

function addToCart(product, size="M", qty=1){
  const key = product.id + "_" + size;
  const existing = state.cart.find(i => i.key === key);
  if(existing){ existing.qty += qty; }
  else {
    state.cart.push({
      key, id:product.id, variant_id: product.variant_id || product.id,
      name:product.name, price:product.price, size, qty, art:product.art, image:product.image
    });
  }
  saveCart();
  showToast(`${product.name} added to cart`);
}
function updateQty(key, delta){
  const item = state.cart.find(i=>i.key===key);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) state.cart = state.cart.filter(i=>i.key!==key);
  saveCart();
  renderCartDrawer();
}
function removeFromCart(key){
  state.cart = state.cart.filter(i=>i.key!==key);
  saveCart();
  renderCartDrawer();
}
function toggleWishlist(product){
  const idx = state.wishlist.findIndex(i=>i.id===product.id);
  if(idx>-1){ state.wishlist.splice(idx,1); showToast("Removed from wishlist"); }
  else { state.wishlist.push(product); showToast("Added to wishlist"); }
  saveWishlist();
  render(); // re-render to flip heart states
}
function isWishlisted(id){ return state.wishlist.some(i=>i.id===id); }
function cartTotal(){ return state.cart.reduce((s,i)=>s+i.price*i.qty,0); }
function cartCount(){ return state.cart.reduce((s,i)=>s+i.qty,0); }

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- API ---------- */
async function fetchProducts(){
  try{
    const res = await fetch(`${API_BASE}/api/products`);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    state.products = data.map(p=>({...p, art: p.art || "tee"}));
  }catch(e){
    console.warn("Backend unreachable, using demo catalog:", e.message);
    state.products = DEMO_PRODUCTS;
  }
  state.loaded = true;
}

async function submitCheckout(customer, shipping){
  const items = state.cart.map(i=>({variant_id:i.variant_id, quantity:i.qty}));
  const res = await fetch(`${API_BASE}/api/checkout/create-order`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({items, customer, shipping})
  });
  if(!res.ok){ const err = await res.json().catch(()=>({})); throw new Error(err.error || "Checkout failed"); }
  return res.json();
}

/* ---------- tiny SVG art library (placeholder product art) ---------- */
function svgArt(kind, opts={}){
  const stroke = opts.stroke || "#ffffff";
  const bg = opts.bg || "#131410";
  const common = `viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"`;
  const wrap = (inner) => `<svg ${common} preserveAspectRatio="xMidYMid slice"><rect width="200" height="200" fill="${bg}"/>${inner}</svg>`;
  switch(kind){
    case "skull": return wrap(`<g fill="none" stroke="${stroke}" stroke-width="3"><circle cx="100" cy="90" r="42"/><circle cx="84" cy="86" r="8"/><circle cx="116" cy="86" r="8"/><path d="M78 118 L88 132 L100 118 L112 132 L122 118"/><path d="M100 48 L100 20 M70 60 L52 40 M130 60 L148 40"/></g>`);
    case "hood": return wrap(`<g fill="none" stroke="${stroke}" stroke-width="3"><path d="M60 150 L60 90 Q100 40 140 90 L140 150"/><path d="M75 95 Q100 75 125 95"/><line x1="70" y1="150" x2="70" y2="175"/><line x1="130" y1="150" x2="130" y2="175"/></g>`);
    case "cargo": return wrap(`<g fill="none" stroke="${stroke}" stroke-width="3"><path d="M75 30 L70 170 L95 170 L100 100 L105 170 L130 170 L125 30 Z"/><rect x="60" y="90" width="20" height="26"/><rect x="120" y="90" width="20" height="26"/></g>`);
    case "tee": return wrap(`<g fill="none" stroke="${stroke}" stroke-width="3"><path d="M70 45 L45 60 L58 82 L70 72 L70 165 L130 165 L130 72 L142 82 L155 60 L130 45 Q115 60 100 60 Q85 60 70 45 Z"/></g>`);
    case "type": return wrap(`<g><path d="M70 45 L45 60 L58 82 L70 72 L70 165 L130 165 L130 72 L142 82 L155 60 L130 45 Q115 60 100 60 Q85 60 70 45 Z" fill="none" stroke="${stroke}" stroke-width="3"/><text x="100" y="120" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="22" fill="${stroke}" letter-spacing="1">STAND</text><text x="100" y="140" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="22" fill="${stroke}" letter-spacing="1">OUT</text></g>`);
    case "anime": return wrap(`<g fill="none" stroke="${stroke}" stroke-width="3"><path d="M70 45 L45 60 L58 82 L70 72 L70 165 L130 165 L130 72 L142 82 L155 60 L130 45 Q115 60 100 60 Q85 60 70 45 Z"/><path d="M85 95 L100 75 L115 95" /><circle cx="90" cy="112" r="4" fill="${stroke}" stroke="none"/><circle cx="110" cy="112" r="4" fill="${stroke}" stroke="none"/><path d="M88 130 Q100 140 112 130"/></g>`);
    case "cap": return wrap(`<g fill="none" stroke="${stroke}" stroke-width="3"><path d="M55 110 Q100 65 145 110 Q145 130 100 132 Q55 130 55 110 Z"/><path d="M55 112 L20 122 Q50 132 60 118"/></g>`);
    case "jacket": return wrap(`<g fill="none" stroke="${stroke}" stroke-width="3"><path d="M65 45 L45 65 L58 90 L65 82 L65 170 L100 170 L100 45 Z"/><path d="M135 45 L155 65 L142 90 L135 82 L135 170 L100 170 L100 45 Z"/><line x1="100" y1="45" x2="100" y2="170"/></g>`);
    default: return wrap(`<circle cx="100" cy="100" r="40" fill="none" stroke="${stroke}" stroke-width="3"/>`);
  }
}
function mediaFor(p, opts={}){
  if(p && p.image){
    return `<img src="${p.image}" alt="${p.name||''}" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:${opts.pos||'top center'};">`;
  }
  return svgArt((p && p.art) || "tee", opts);
}

/* ---------- drop countdown (signature functional element) ---------- */
function nextDropDate(){
  const d = new Date();
  const day = d.getDay(); // 0 Sun ... 6 Sat
  const daysUntilSun = (7 - day) % 7 || 7;
  const target = new Date(d);
  target.setDate(d.getDate() + daysUntilSun);
  target.setHours(20,0,0,0);
  if(target <= d) target.setDate(target.getDate()+7);
  return target;
}
let dropInterval;
function startDropCountdown(){
  clearInterval(dropInterval);
  const target = nextDropDate();
  const tick = () => {
    const el = document.getElementById("dropTimer");
    if(!el) { clearInterval(dropInterval); return; }
    const diff = target - new Date();
    const d = Math.max(0, Math.floor(diff/86400000));
    const h = Math.max(0, Math.floor((diff%86400000)/3600000));
    const m = Math.max(0, Math.floor((diff%3600000)/60000));
    const s = Math.max(0, Math.floor((diff%60000)/1000));
    el.innerHTML = `
      <div class="dropbar__unit">${String(d).padStart(2,"0")}<small>days</small></div>
      <div class="dropbar__unit">${String(h).padStart(2,"0")}<small>hrs</small></div>
      <div class="dropbar__unit">${String(m).padStart(2,"0")}<small>min</small></div>
      <div class="dropbar__unit">${String(s).padStart(2,"0")}<small>sec</small></div>
    `;
  };
  tick();
  dropInterval = setInterval(tick, 1000);
}

/* ---------- routing ---------- */
function getRoute(){
  const hash = location.hash.slice(1) || "/";
  const [path, query] = hash.split("?");
  const params = new URLSearchParams(query || "");
  return {path, params};
}
window.addEventListener("hashchange", render);

function render(){
  const {path} = getRoute();
  let body = "";
  if(!state.loaded){
    body = `<div class="page wrap"><div class="empty-page">Loading…</div></div>`;
  } else if(path === "/" || path === ""){
    body = homeHTML();
  } else if(path === "/shop"){
    body = shopHTML();
  } else if(path.startsWith("/product/")){
    body = productHTML(decodeURIComponent(path.split("/product/")[1]));
  } else if(path === "/cart"){
    body = cartHTML();
  } else if(path === "/wishlist"){
    body = wishlistHTML();
  } else if(path === "/checkout"){
    body = checkoutHTML();
  } else if(path.startsWith("/order/")){
    body = `<div class="page wrap"><div class="empty-page"><h2 class="h-display" style="color:var(--acid);font-size:28px;">Order placed</h2><p style="margin-top:10px;">Order ID: ${path.split("/order/")[1]}</p><a href="#/shop" class="btn btn-primary" style="margin-top:20px;">Keep shopping</a></div></div>`;
  } else {
    body = `<div class="page wrap"><div class="empty-page">Page not found.</div></div>`;
  }

  document.getElementById("app").innerHTML = `
    ${headerHTML()}
    <main>${body}</main>
    ${footerHTML()}
    ${cartDrawerHTML()}
    ${wishDrawerHTML()}
  `;
  window.scrollTo(0,0);
  bindEvents();
  if(path === "/" || path === "") startDropCountdown();
}

/* ---------- events ---------- */
function bindEvents(){
  const dropsTrack = document.getElementById("dropsTrack");
  if(dropsTrack){
    document.getElementById("dropsPrev")?.addEventListener("click", ()=> dropsTrack.scrollBy({left:-320, behavior:"smooth"}));
    document.getElementById("dropsNext")?.addEventListener("click", ()=> dropsTrack.scrollBy({left:320, behavior:"smooth"}));
  }

  const compareSlider = document.getElementById("compareSlider");
  if(compareSlider){
    const handle = document.getElementById("compareHandle");
    const afterImg = compareSlider.querySelector(".after");
    let dragging = false;
    const setPos = (clientX) => {
      const rect = compareSlider.getBoundingClientRect();
      let pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.max(0, Math.min(100, pct));
      handle.style.left = pct + "%";
      if(afterImg) afterImg.style.clipPath = `inset(0 0 0 ${pct}%)`;
    };
    const start = (e) => { dragging = true; setPos((e.touches?e.touches[0].clientX:e.clientX)); };
    const move = (e) => { if(!dragging) return; setPos((e.touches?e.touches[0].clientX:e.clientX)); };
    const end = () => { dragging = false; };
    handle.addEventListener("mousedown", start);
    compareSlider.addEventListener("mousedown", start);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    compareSlider.addEventListener("touchstart", start, {passive:true});
    window.addEventListener("touchmove", move, {passive:true});
    window.addEventListener("touchend", end);
  }
  document.getElementById("scrim").onclick = closeDrawers;

  document.querySelectorAll("[data-open]").forEach(btn=>{
    btn.addEventListener("click", ()=>openDrawer(btn.dataset.open));
  });
  document.querySelectorAll("[data-close]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ closeDrawers(); });
  });

  document.querySelectorAll("[data-quickadd]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      const p = state.products.find(x=>x.id===btn.dataset.quickadd);
      if(p) addToCart(p, "M", 1);
    });
  });
  document.querySelectorAll("[data-wish]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      const p = state.products.find(x=>x.id===btn.dataset.wish) || state.wishlist.find(x=>x.id===btn.dataset.wish);
      if(p) toggleWishlist(p);
    });
  });

  const sizeGrid = document.getElementById("sizeGrid");
  if(sizeGrid){
    sizeGrid.querySelectorAll(".size-box").forEach(b=>{
      b.addEventListener("click", ()=>{
        sizeGrid.querySelectorAll(".size-box").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
      });
    });
  }
  const pdpAdd = document.getElementById("pdpAdd");
  if(pdpAdd){
    pdpAdd.addEventListener("click", ()=>{
      const p = state.products.find(x=>x.id===pdpAdd.dataset.id);
      const size = sizeGrid?.querySelector(".size-box.active")?.dataset.size || "M";
      if(p) addToCart(p, size, 1);
    });
  }
  const pdpWish = document.getElementById("pdpWish");
  if(pdpWish){
    pdpWish.addEventListener("click", ()=>{
      const p = state.products.find(x=>x.id===pdpWish.dataset.id);
      if(p) toggleWishlist(p);
    });
  }

  document.querySelectorAll("[data-qty]").forEach(btn=>{
    btn.addEventListener("click", ()=>updateQty(btn.dataset.key, parseInt(btn.dataset.qty)));
  });
  document.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>removeFromCart(btn.dataset.remove));
  });

  const newsletterForm = document.getElementById("newsletterForm");
  if(newsletterForm){
    newsletterForm.addEventListener("submit", (e)=>{
      e.preventDefault();
      showToast("Subscribed! Watch your inbox for the next drop.");
      newsletterForm.reset();
    });
  }

  const checkoutForm = document.getElementById("checkoutForm");
  if(checkoutForm){
    checkoutForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const fd = new FormData(checkoutForm);
      const customer = {name:fd.get("name"), email:fd.get("email"), phone:fd.get("phone")};
      const shipping = {
        name:fd.get("name"), line1:fd.get("line1"), city:fd.get("city"),
        state:fd.get("state"), pincode:fd.get("pincode"), phone:fd.get("phone")
      };
      const submitBtn = checkoutForm.querySelector("button[type=submit]");
      submitBtn.disabled = true; submitBtn.textContent = "Processing…";
      try{
        const {orderId, paymentSessionId} = await submitCheckout(customer, shipping);
        // In production: load Cashfree JS SDK and call cashfree.checkout({paymentSessionId})
        // to redirect the shopper into the hosted payment page. Example:
        //
        // const cashfree = Cashfree({mode: "sandbox"});
        // cashfree.checkout({ paymentSessionId, redirectTarget: "_self" });
        console.log("Cashfree session ready:", paymentSessionId);
        state.cart = []; saveCart();
        location.hash = `#/order/${orderId}`;
      }catch(err){
        showToast(err.message || "Checkout failed — try again");
        submitBtn.disabled = false; submitBtn.textContent = "Pay with Cashfree";
      }
    });
  }
}
function bindDrawerEvents(){
  document.querySelectorAll("[data-qty]").forEach(btn=>{
    btn.addEventListener("click", ()=>updateQty(btn.dataset.key, parseInt(btn.dataset.qty)));
  });
  document.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>removeFromCart(btn.dataset.remove));
  });
  document.querySelectorAll("[data-close]").forEach(btn=>{
    btn.addEventListener("click", closeDrawers);
  });
}

/* ---------- boot ---------- */
(async function init(){
  render(); // show loading state immediately
  await fetchProducts();
  render();
})();
</script>
</body>
</html>
